name: Weekly draft

# Manual trigger only. The brief schedules this for Friday morning, but the
# editor decides exactly when to run it — usually after curating Selected
# articles in Notion on Thursday evening.
on:
  workflow_dispatch:

# Needed by the commit step below. The site content file is committed with the
# built-in GITHUB_TOKEN, which is the reason the pipeline and the site live in
# one repo — no cross-repo PAT to create, rotate, or have silently expire.
permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_ARTICLES_DB_ID: ${{ secrets.NOTION_ARTICLES_DB_ID }}
          NOTION_ISSUES_DB_ID: ${{ secrets.NOTION_ISSUES_DB_ID }}
        run: python -m scripts.generate_draft

      # The Substack draft is a work artifact, not source — it stays out of git
      # and comes down from the run page instead.
      - name: Upload Substack draft as artifact
        if: always() # upload even on partial failure (e.g. some fetch errors)
        uses: actions/upload-artifact@v4
        with:
          name: weekly-draft
          path: drafts/draft-*.md
          if-no-files-found: warn
          retention-days: 30

      # The site content file IS source. Commit it so the editor only has to
      # pull, drop images in, and push.
      - name: Commit site content
        if: always()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain site/src/content/issues)" ]; then
            echo "No site content changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/content/issues
          git commit -m "Add generated issue content for $(date -u +%G-W%V)"
          git push
